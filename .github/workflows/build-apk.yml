name: Build Video Maker APK

permissions:
  contents: write


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Sync web assets
        run: mkdir -p android/app/src/main/assets/www && cp index.html android/app/src/main/assets/www/index.html
      - name: Apply v3.89 patches
        run: python3 v389-patch.py
      - name: Apply v3.90 patches
        run: python3 v390-patch.py
      - name: Apply v3.91 patches
        run: python3 v391-patch.py
      - name: Apply v3.93 patches
        run: python3 v393-patch.py
      - name: Apply v3.94 patches
        run: python3 v394-patch.py
      - name: Apply v3.95 patches
        run: python3 v395-patch.py
      - name: Apply v3.96 patches
        run: python3 v396-patch.py
      - name: Apply v3.97 patches
        run: python3 v397-patch.py
      - name: Apply v3.98 patches
        run: python3 v398-patch.py
      - name: Apply v3.99 patches
        run: python3 v399-patch.py
      - name: Apply v4.00 patches
        run: python3 v400-patch.py
      - name: Apply v4.01 patches
        run: python3 v401-patch.py
      - name: Apply v4.02 patches
        run: python3 v402-patch.py
      - name: Apply v4.03 patches
        run: python3 v403-patch.py
      - name: Apply v4.04 patches
        run: python3 v404-patch.py
      - name: Apply v4.05 patches
        run: python3 v405-patch.py
      - name: Apply v4.06 patches
        run: python3 v406-patch.py
      - name: Apply v4.07 patches
        run: python3 v407-patch.py
      - name: Apply v4.08 patches
        run: python3 v408-patch.py
      - name: Apply v4.09 patches
        run: python3 v409-patch.py
      - name: Apply v4.10 patches
        run: python3 v410-patch.py
      - name: Apply v4.11 patches
        run: python3 v411-patch.py
      - name: Apply v4.12 patches
        run: python3 v412-patch.py
      - name: Apply v4.13 patches
        run: python3 v413-patch.py
      - name: Apply v4.14 patches
        run: python3 v414-patch.py
      - name: Apply v4.15 patches
        run: python3 v415-patch.py
      - name: Apply v4.16 patches
        run: python3 v416-patch.py
      - name: Apply v4.17 patches
        run: python3 v417-patch.py
      - name: Apply v4.18 patches
        run: python3 v418-patch.py
      - name: Apply v4.20 patches
        run: python3 v420-patch.py
      - name: Apply v4.21 patches
        run: python3 v421-patch.py
      - name: Apply v4.23 patches
        run: python3 v423-patch.py
      - name: Apply v4.24 patches
        run: python3 v424-patch.py
      - name: Apply v4.25 patches
        run: python3 v425-patch.py
      - name: Apply v4.26 patches
        run: python3 v426-patch.py
      - name: Apply v4.27 patches
        run: python3 v427-patch.py
      - name: Apply v4.28 patches
        run: python3 v428-patch.py
      - name: Apply v4.29 patches
        run: python3 v429-patch.py
      - name: Apply v4.30 patches
        run: python3 v430-patch.py
      - name: Apply v4.31 patch
        run: python3 v431-patch.py
      - name: Apply v4.32 patch
        run: python3 v432-patch.py
      - name: Apply v4.33 patch
        run: python3 v433-patch.py
      - name: Apply v4.34 patch
        run: python3 v434-patch.py
      - name: Apply v4.35 patch
        run: python3 v435-patch.py
      - name: Bundle clips into APK
        run: |
          mkdir -p android/app/src/main/assets/clips
          cd android/app/src/main/assets/clips
          curl -L -o rayo-driving.mp4 https://github.com/Hamzaagsm/videomaker/releases/download/clips-v1/rayo-driving.mp4
          curl -L -o rayo-talking.mp4 https://github.com/Hamzaagsm/videomaker/releases/download/clips-v1/rayo-talking.mp4
          curl -L -o bella-driving.mp4 https://github.com/Hamzaagsm/videomaker/releases/download/clips-v1/bella-driving.mp4
          curl -L -o bella-talking.mp4 https://github.com/Hamzaagsm/videomaker/releases/download/clips-v1/bella-talking.mp4
          curl -L -o rusty-driving.mp4 https://github.com/Hamzaagsm/videomaker/releases/download/clips-v1/rusty-driving.mp4
          ls -la
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon -x lint
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MEER.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk HamzaVideoMaker-v2.apk
          ls -la MEER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamzaVideoMaker-apk
          path: HamzaVideoMaker-v2.apk
