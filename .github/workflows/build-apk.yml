name: Build Video Maker APK

permissions:
  contents: write


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Sync web assets
        run: mkdir -p android/app/src/main/assets/www && cp index.html android/app/src/main/assets/www/index.html
      - name: Apply v3.89 patches
        run: python3 v389-patch.py
      - name: Apply v3.90 patches
        run: python3 v390-patch.py
      - name: Apply v3.91 patches
        run: python3 v391-patch.py
      - name: Apply v3.93 patches
        run: python3 v393-patch.py
      - name: Apply v3.94 patches
        run: python3 v394-patch.py
      - name: Apply v3.95 patches
        run: python3 v395-patch.py
      - name: Apply v3.96 patches
        run: python3 v396-patch.py
      - name: Apply v3.97 patches
        run: python3 v397-patch.py
      - name: Apply v3.98 patches
        run: python3 v398-patch.py
      - name: Apply v3.99 patches
        run: python3 v399-patch.py
      - name: Apply v4.00 patches
        run: python3 v400-patch.py
      - name: Apply v4.01 patches
        run: python3 v401-patch.py
      - name: Apply v4.02 patches
        run: python3 v402-patch.py
      - name: Apply v4.03 patches
        run: python3 v403-patch.py
      - name: Apply v4.04 patches
        run: python3 v404-patch.py
      - name: Apply v4.05 patches
        run: python3 v405-patch.py
      - name: Apply v4.06 patches
        run: python3 v406-patch.py
      - name: Apply v4.07 patches
        run: python3 v407-patch.py
      - name: Apply v4.08 patches
        run: python3 v408-patch.py
      - name: Apply v4.09 patches
        run: python3 v409-patch.py
      - name: Apply v4.10 patches
        run: python3 v410-patch.py
      - name: Apply v4.11 patches
        run: python3 v411-patch.py
      - name: Apply v4.12 patches
        run: python3 v412-patch.py
      - name: Apply v4.13 patches
        run: python3 v413-patch.py
      - name: Apply v4.14 patches
        run: python3 v414-patch.py
      - name: Apply v4.15 patches
        run: python3 v415-patch.py
      - name: Apply v4.16 patches
        run: python3 v416-patch.py
      - name: Apply v4.17 patches
        run: python3 v417-patch.py
      - name: Apply v4.18 patches
        run: python3 v418-patch.py
      - name: Apply v4.20 patches
        run: python3 v420-patch.py
      - name: Apply v4.21 patches
        run: python3 v421-patch.py
      - name: Apply v4.23 patches
        run: python3 v423-patch.py
      - name: Apply v4.24 patches
        run: python3 v424-patch.py
      - name: Apply v4.25 patches
        run: python3 v425-patch.py
      - name: Apply v4.26 patches
        run: python3 v426-patch.py
      - name: Apply v4.27 patches
        run: python3 v427-patch.py
      - name: Apply v4.28 patches
        run: python3 v428-patch.py
      - name: Apply v4.29 patches
        run: python3 v429-patch.py
      - name: Apply v4.30 patches
        run: python3 v430-patch.py
      - name: Apply v4.31 patch
        run: python3 v431-patch.py
      - name: Apply v4.32 patch
        run: python3 v432-patch.py
      - name: Apply v4.33 patch
        run: python3 v433-patch.py
      - name: Apply v4.34 patch
        run: python3 v434-patch.py
      - name: Apply v4.35 patch
        run: python3 v435-patch.py
      - name: Apply v4.36 patch
        run: python3 v436-patch.py
      - name: Apply v4.37 patch
        run: python3 v437-patch.py
      - name: Apply v4.38 patch
        run: python3 v438-patch.py
      - name: Apply v4.39 patch
        run: python3 v439-patch.py
      - name: Apply v4.40 patches
        run: python3 v440-patch.py
      - name: Apply v4.41 patches
        run: python3 v441-patch.py
      - name: Apply v4.42 patches
        run: python3 v442-patch.py
      - name: Apply v4.43 patches
        run: python3 v443-patch.py
      - name: Apply v4.44 patches
        run: python3 v444-patch.py
      - name: Apply v4.45 patch
        run: python3 v445-patch.py
      - name: Apply v4.46 patch
        run: python3 v446-patch.py
      - name: Apply v4.47 patch
        run: python3 v447-patch.py
      - name: Apply v4.48 patch
        run: python3 v448-patch.py
      - name: Apply v4.49 patch
        run: python3 v449-patch.py
      - name: Apply v4.50 patch
        run: python3 patch_v450.py
      - name: Apply v4.50 java patch
        run: python3 patch_v450_java.py
      - name: Apply v4.51 layout patch
        run: python3 patch_v451.py
      - name: Apply v4.52 patch
        run: python3 patch_v452.py
      - name: Apply v4.52 java patch
        run: python3 patch_v452_java.py
      - name: Apply v4.53 patch
        run: python3 patch_v453.py
      - name: Apply v4.53 java patch
        run: python3 patch_v453_java.py
      - name: Apply v4.54 patch
        run: python3 patch_v454.py
      - name: Apply v4.54 java patch
        run: python3 patch_v454_java.py
      - name: Apply v4.55 patch
        run: python3 patch_v455.py
      - name: Apply v4.55 java patch
        run: python3 patch_v455_java.py
      - name: Apply v4.56 patch
        run: python3 patch_v456.py
        - name: Apply v4.57 patch
        run: python3 patch_v457.py
      - name: Bundle music into APK
        run: mkdir -p android/app/src/main/assets/music && cp music/*.mp3 android/app/src/main/assets/music/ || true
      - name: Validate built JS (syntax gate)
        run: python3 validate_js.py android/app/src/main/assets/www/index.html
      - name: Bundle clips into APK
        run: |
          mkdir -p android/app/src/main/assets/clips
          cp clips/*.mp4 android/app/src/main/assets/clips/
          ls -la android/app/src/main/assets/clips/
      - name: Bundle adventure clips into APK
        run: |
          mkdir -p android/app/src/main/assets/clips
          for f in adv-rayo-talk.mp4 adv-bella-talk.mp4 adv-rayo-beach.mp4 adv-bella-town.mp4 adv-rusty-town.mp4 adv-friends.mp4 adv-rayo-snow.mp4 adv-bella-autumn.mp4 adv-friends-race.mp4 adv-rayo-meadow.mp4 adv-bella-beach.mp4 adv-rusty-farm.mp4; do cp adv-clips/$f android/app/src/main/assets/clips/; done
          ls -la android/app/src/main/assets/clips/
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon -x lint
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MEER.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk HamzaVideoMaker-v2.apk
          ls -la MEER.apk
      - name: Sign APK with permanent MEER key
        env:
          MEER_KEYSTORE_B64: ${{ secrets.MEER_KEYSTORE_B64 }}
          MEER_KEYSTORE_PASS: ${{ secrets.MEER_KEYSTORE_PASS }}
        run: |
          echo "$MEER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/meer.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in HamzaVideoMaker-v2.apk MEER.apk; do
            "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/meer.p12" --ks-type PKCS12 --ks-pass "pass:$MEER_KEYSTORE_PASS" --key-pass "pass:$MEER_KEYSTORE_PASS" --ks-key-alias meer --out "$f" "$RUNNER_TEMP/aligned.apk"
          done
          "$BT/apksigner" verify --print-certs HamzaVideoMaker-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamzaVideoMaker-apk
          path: HamzaVideoMaker-v2.apk
