name: Build Video Maker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Sync web assets
        run: mkdir -p android/app/src/main/assets/www && cp index.html android/app/src/main/assets/www/index.html && sed -i "s/const APP_VER='3.84'/const APP_VER='3.86'/g; s/const dur=Math.max(2.5,audioDurSec+0.6);/const dur=Math.max(1.0,audioDurSec+0.3);/g; s/v3.84 MEER/v3.86 MEER/g" android/app/src/main/assets/www/index.html
      - name: Apply v3.86 patches
        run: python3 v386-patch.py
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon -x lint
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MEER.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk HamzaVideoMaker-v2.apk
          ls -la MEER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamzaVideoMaker-apk
          path: HamzaVideoMaker-v2.apk
      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-latest
          name: MEER (Auto Build)
          body: |
            🤖 Automatic build from latest code.
            **Download:** MEER.apk below 👇
          files: MEER.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
