name: Diag secret format

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose MEER_KEYSTORE_B64 format
        env:
          V: ${{ secrets.MEER_KEYSTORE_B64 }}
          P: ${{ secrets.MEER_KEYSTORE_PASS }}
        run: |
          echo "raw_len=${#V}"
          C=$(printf '%s' "$V" | tr -d '[:space:]')
          echo "stripped_len=${#C}"
          echo "stripped_mod4=$(( ${#C} % 4 ))"
          if printf '%s' "$C" | base64 -d > /tmp/k.p12 2>/tmp/err; then
            echo "decode=OK decoded_size=$(wc -c < /tmp/k.p12)"
            echo "sha256=$(sha256sum /tmp/k.p12 | cut -d' ' -f1)"
            keytool -list -v -keystore /tmp/k.p12 -storetype PKCS12 -storepass "$P" 2>/dev/null | grep -i "SHA256:" || echo "fingerprint_not_read"
          else
            echo "decode=FAIL"
            cat /tmp/err
          fi
