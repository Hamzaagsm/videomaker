name: Release v4.53 APK

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download APK artifact from build run 351
        run: gh run download 39927551808 --repo ${{ github.repository }} --name HamzaVideoMaker-apk --dir artifact
      - name: Create v4.53 release with APK asset
        run: |
          ls -la artifact
          gh release create v4.53-apk --repo ${{ github.repository }} --title "MEER v4.53" --notes "v4.53 — compose hang fix: 12-minute deadline, segment progress (hissa s/total), atki halat khud saaf (reset), per-segment caps. v4.52 par upgrade." --latest artifact/HamzaVideoMaker-v2.apk
