plugins { id 'com.android.application' }
android {
    namespace 'com.hamza.videomaker'
    compileSdk 34
    defaultConfig {
        applicationId "com.hamza.videomaker"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
